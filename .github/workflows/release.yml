# Publishing to PyPI, from a version tag, without a stored credential.
#
# PyPI trusts this workflow by identity (a "trusted publisher": repository, workflow
# file and environment name are registered on PyPI), so there is no token to leak
# and nothing to rotate. The files that are published are the ones built here, from
# the tagged commit, with build tools installed from a hashed lock; the publish job
# adds PEP 740 attestations that tie each file to this run.
#
# One-time setup on PyPI and GitHub is in CONTRIBUTING.md ("Releasing").

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: The tag matches the code and the changelog
        run: python tools/check_release.py "$GITHUB_REF_NAME"

      - name: Build
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.release.lock
          python -m build --no-isolation --outdir dist

      - name: The files contain what the package needs
        run: |
          python tools/check_release.py "$GITHUB_REF_NAME" dist
          sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scanprivacy
    permissions:
      id-token: write # the identity PyPI checks
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
