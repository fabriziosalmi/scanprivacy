# The test suite, on a runner that is not the author's laptop.
#
# Three things here are not incidental. The browser is installed, because a
# suite that skips every Playwright test still reports "passed" and would have
# hidden the orchestration and robots.txt guarantees entirely. The PDF system
# libraries are installed, for the same reason. And every `uses:` is pinned to a
# commit — tests/test_workflows.py enforces that over this file too, since CI
# runs with a token and a moved tag is a moved dependency.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and the version actually developed
        # against. A suite that only ever runs on one of them is not testing
        # `requires-python`, it is asserting it.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PDF libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 libcairo2

      - name: Install
        # From the hashed lockfile, the same resolution the image uses, so the
        # suite runs against the dependencies that ship and a moved release
        # cannot change what is tested.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Install browser
        # Without this, every test that opens a page is skipped by
        # `pytest.importorskip` and the run is green for the wrong reason.
        run: python -m playwright install --with-deps chromium

      - name: Install cosign
        # Same reason as the browser. `scanprivacy attest --sign cosign-key` and
        # `verify-attestation` are the mechanism behind the claim that a report
        # can be shown to be the one that was published, and the round-trip test
        # for them is gated on cosign being present. Without this it skipped
        # here and ran only on the author's laptop — which is not a place a
        # regression gets caught.
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Test
        # `-rs` lists every skip and its reason. A skipped test is not a failure,
        # but a run that hides which tests did not execute is a green tick over
        # an unknown quantity — and finding out took reading two logs.
        run: python -m pytest -q -rs --cov --cov-fail-under=85

  lint:
    # Undefined names, unused imports and bugbear: the cheap class of defect a
    # test suite finds late and a linter finds at once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Ruff
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m ruff check src tests

  audit:
    # The locked dependencies against the advisory databases. The lockfile is
    # what ships, so it is what is audited; a new advisory fails here rather
    # than being discovered by whoever deploys the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --no-deps --disable-pip
          python -m pip_audit -r requirements.runtime.lock --no-deps --disable-pip

  package:
    # The licence is declared in the PEP 639 form, which needs setuptools>=77.
    # A metadata error surfaces at build time and nowhere else, so it is built
    # here rather than discovered on the day of an upload to PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check dist/*

      - name: Show what the metadata says about the licence
        run: |
          python - <<'PY'
          import pathlib, re, tarfile
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as tar:
              name = next(n for n in tar.getnames() if n.endswith("PKG-INFO"))
              text = tar.extractfile(name).read().decode()
          for line in text.splitlines():
              if re.match(r"^(License|License-Expression|License-File|Name|Version):", line):
                  print(line)
          assert "AGPL-3.0-only" in text, "the AGPL declaration did not survive the build"
          assert "License-File: LICENSE" in text, "LICENSE is not in the distribution"
          PY
