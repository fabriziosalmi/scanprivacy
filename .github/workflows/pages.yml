# The public site: landing page, the docs as HTML, and an example report.
#
# The example report is made here, at deploy time, by this engine, against the
# author's own site. It is not committed: a scan result names a site and grades
# it, and tests/test_repo_hygiene.py keeps those out of the repository. Making it
# on every deploy (and weekly) also means the example is never older than the
# engine that produced it. If the scan fails, the site is published without it.

name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 libcairo2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Example report
        # Allowed to fail: the site is worth publishing without it.
        continue-on-error: true
        env:
          SCANPRIVACY_CONTACT: abuse@scanprivacy.org
        run: |
          mkdir -p example
          scanprivacy scan https://audiolibri.org --pages 3 \
            --md example/report.md --pdf example/report.pdf --json example/evidence.json

      - name: Build the site
        run: python site/build.py _site --example example

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
